<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immunization Card - {{ child.full_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="h4 mb-0">Immunization Card Preview</h1>
                <div class="text-muted small">{{ child.full_name }} ({{ child.unique_id }})</div>
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-primary" href="{% url 'immunization_card_pdf' child.unique_id %}?download=1">Download Card</a>
                <form method="post" action="{% url 'doctor_send_calendar' child.unique_id %}">
                    {% csrf_token %}
                    <button class="btn btn-primary" type="submit">Send Calendar + Card</button>
                </form>
                <a class="btn btn-outline-secondary" href="{% url 'doctor_child_detail' child.unique_id %}">Back to Child</a>
            </div>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
        {% endif %}

        <div class="card">
            <div class="card-body p-2">
                <object
                    data="{{ pdf_data_uri }}"
                    type="application/pdf"
                    style="width: 100%; height: 78vh; border: 0;"
                    title="Immunization card preview">
                    <p class="mb-0">
                        Preview could not be displayed in-browser.
                        <a href="{{ pdf_data_uri }}" target="_blank" rel="noopener">Open card in a new tab</a>
                        or
                        <a href="{% url 'immunization_card_pdf' child.unique_id %}?download=1">download it</a>.
                    </p>
                </object>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
